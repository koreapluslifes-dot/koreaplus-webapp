name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Worker (TypeScript)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy src/worker.ts
        # NOTE: API secrets are managed separately via `wrangler secret put`.
        # Existing secrets on the Worker persist across code deploys.
        # When new keys are issued, register via:
        #   npx wrangler secret put TOUR_API_KEY   (then paste value)
        #   npx wrangler secret put KOPIS_API_KEY
        #   etc.
