name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Worker (TypeScript)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy src/worker.ts
          secrets: |
            OPENROUTER_API_KEY
            GOOGLE_PLACES_KEY
            TOUR_API_KEY
            KOPIS_API_KEY
            KMA_API_KEY
            AIRKOREA_API_KEY
            SEOUL_OPEN_DATA_KEY
            EXCHANGE_RATE_KEY
            GROQ_API_KEY
        env:
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_PLACES_KEY:     ${{ secrets.GOOGLE_PLACES_KEY }}
          TOUR_API_KEY:          ${{ secrets.TOUR_API_KEY }}
          KOPIS_API_KEY:         ${{ secrets.KOPIS_API_KEY }}
          KMA_API_KEY:           ${{ secrets.KMA_API_KEY }}
          AIRKOREA_API_KEY:      ${{ secrets.AIRKOREA_API_KEY }}
          SEOUL_OPEN_DATA_KEY:   ${{ secrets.SEOUL_OPEN_DATA_KEY }}
          EXCHANGE_RATE_KEY:     ${{ secrets.EXCHANGE_RATE_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
