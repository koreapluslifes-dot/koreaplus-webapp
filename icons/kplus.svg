<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600">
  <!-- Navy background -->
  <rect width="512" height="600" fill="#0c1829"/>
  <!-- Red circle -->
  <circle cx="256" cy="248" r="222" fill="#c8192c"/>
  <!-- K — bold white, left side of circle -->
  <text x="72" y="368"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="228" font-weight="900"
        fill="white">K</text>
  <!-- Stylized + — rounded pill arms -->
  <!-- Vertical arm -->
  <rect x="342" y="118" width="66" height="228" rx="33" fill="white"/>
  <!-- Horizontal arm -->
  <rect x="278" y="204" width="194" height="66" rx="33" fill="white"/>
  <!-- PLUS label below circle -->
  <text x="256" y="558"
        font-family="Arial,Helvetica,sans-serif"
        font-size="72" font-weight="700"
        fill="#4a6d92"
        text-anchor="middle"
        letter-spacing="18">PLUS</text>
</svg>
